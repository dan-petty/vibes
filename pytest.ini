[pytest]
testpaths = tests examples benchmarks
# xdist is disabled deliberately, and the measurement is the reason: this suite is 255
# fast tests whose cost is import and collection, not execution. Sixteen worker
# interpreters each re-import the corpus, so `-n auto` measured 7.2s against 5.7s serial
# - 26% slower. Re-enable only with a measurement showing otherwise.
addopts = -p no:cov -p no:logfire -p no:xdist -p no:anyio -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
