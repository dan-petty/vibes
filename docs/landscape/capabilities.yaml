# What this repository builds, and the third-party projects that build something comparable.
#
# The shape of this file is the safeguard. A feature is claimed for an alternative only by
# writing an entry under `has:` whose value is the evidence for it — a flag, a command, a
# documented behaviour. There is no way to assert a capability without citing something,
# which is what stops a survey inventing a feature matrix out of README keywords.
#
# A feature absent from both `has:` and `lacks:` is *unknown*, never *no*. "We searched and
# did not find it" and "it is not there" are different claims, and only the second belongs
# in `lacks:`. Gap detection reads `has:` alone, so an unknown can never manufacture work.

feature_catalog:
  cyclomatic_complexity: Flags functions exceeding a cyclomatic complexity ceiling
  nesting_depth: Flags block nesting deeper than a configured ceiling
  maintainability_index: Reports a normalized maintainability score per module
  halstead_metrics: Reports Halstead volume, difficulty or effort
  trend_over_time: Tracks metric movement across git history rather than one snapshot
  per_file_baseline: Accepts existing violations so a gate can be adopted incrementally
  sarif_output: Emits SARIF for code scanning and security dashboards
  multi_language: Analyses languages beyond Python
  auto_fix: Rewrites source to remove the finding, not only report it
  pre_commit_hook: Ships a documented pre-commit integration
  editor_lsp: Provides a language server or first-party editor integration
  clone_detection: Detects duplicated or near-duplicated blocks
  dead_code: Detects unreferenced symbols
  import_cycles: Detects circular imports between modules
  cohesion_metric: Reports a class cohesion measure such as LCOM
  secret_scanning: Detects credentials or private network addresses in source
  link_checking: Verifies that document links resolve
  diagram_rendering: Verifies embedded diagrams actually render
  prose_style: Enforces prose style or terminology rules
  markdown_structure: Enforces document structure or heading conventions
  config_presets: Ships selectable rule presets rather than one fixed rule set
  baseline_diff: Reports only findings introduced relative to a base revision
  adversarial_prompts: Generates adversarial or mutated prompts against a target
  attack_taxonomy: Classifies probes against a published attack taxonomy
  model_providers: Drives more than one model provider out of the box
  goroutine_leak_detection: Detects goroutines that outlive the work that started them
  test_harness_integration: Fails an ordinary test run when the defect is present
  incremental_parsing: Reparses only the edited region rather than the whole file
  structural_query: Matches code by syntax structure rather than by text
  javascript_rendering: Renders client-side pages rather than reading raw HTML only
  politeness_controls: Paces or throttles requests per host
  strategy_memory: Remembers a per-domain acquisition strategy across runs
  llm_ready_output: Emits text shaped for direct model consumption
  syscall_isolation: Confines a workload below the process boundary
  resource_caps: Bounds memory, CPU or process count
  egress_control: Denies or restricts outbound network by default
  benchmark_audit: Audits configuration against a published hardening benchmark
  repo_packing: Serializes a repository into a single model-ready artifact
  token_budgeting: Fits its output to a token budget
  relevance_ranking: Orders or selects content by estimated relevance
  otel_export: Emits OpenTelemetry spans
  semantic_conventions: Follows published semantic conventions for AI spans
  cost_attribution: Attributes token or currency cost to spans
  waterfall_rendering: Renders a trace as a readable waterfall
  contract_driven: Generates from a declared interface rather than free-form template variables
  gate_clean_output: Emits code that passes the generating project's own quality gates unedited
  regeneration_safe: Regenerates without overwriting hand-written code
  interactive_prompts: Collects values from the author interactively
  template_ecosystem: Offers a published library of community templates
  update_in_place: Re-applies a newer template to a project already generated from it

# `kind` is declared, never inferred. Classifying prose by keyword is the proxy that made
# the self-hardening audit reject a real guardrail, and the same trap applies here: a
# portfolio measurement that guesses would report whatever its word list happened to catch.
#   capability - something a reader runs to build or operate an application
#   quality    - something that judges work that already exists
capabilities:
  - key: complexity-gating
    kind: quality
    title: Mechanical complexity and nesting invariant gate
    short: Complexity gate
    path: examples/ast-invariant-sentinel/sentinel.py
    ours:
      - cyclomatic_complexity
      - nesting_depth
      - secret_scanning
      - pre_commit_hook
      - sarif_output
      - per_file_baseline
      - baseline_diff
    alternatives:
      - repo: rubik/xenon
        has:
          cyclomatic_complexity: "Fails the build on --max-absolute / --max-average / --max-modules thresholds"
        lacks: [multi_language]
      - repo: terryyin/lizard
        package: lizard
        license: MIT
        adoptable: true
        adoption_note: "MIT, pure Python, multi-language complexity"
        has:
          cyclomatic_complexity: "-C sets a CCN warning threshold and exits non-zero"
          multi_language: "Documents C/C++, Java, JavaScript, Go, Rust, Swift and more"
          per_file_baseline: "-W whitelist file suppresses known warnings"
      - repo: astral-sh/ruff
        package: ruff
        license: MIT
        adoptable: true
        adoption_note: "MIT, already a declared dependency in the lint extra"
        has:
          cyclomatic_complexity: "C901 via mccabe, max-complexity setting"
          auto_fix: "ruff check --fix rewrites source"
          editor_lsp: "ruff server implements the Language Server Protocol"
          pre_commit_hook: "Publishes ruff-pre-commit"
          sarif_output: "--output-format sarif"
          config_presets: "select / extend-select rule families in pyproject.toml"
        lacks: [multi_language]
      - repo: pylint-dev/pylint
        package: pylint
        license: GPL-2.0-or-later
        adoptable: false
        adoption_note: "GPL-2.0-or-later fails 1a's Apache-2.0 compatibility bar; ruff covers its rules under MIT"
        has:
          cyclomatic_complexity: "R0912 too-many-branches and related design checks"
          config_presets: "Enable/disable by message family in pylintrc"

  - key: smell-quantification
    kind: quality
    title: Quantified structural decay across a repository
    short: Smell quantifier
    path: examples/code-smell-quantifier/smell_quantifier.py
    ours:
      - maintainability_index
      - halstead_metrics
      - clone_detection
      - dead_code
      - import_cycles
      - cohesion_metric
      - sarif_output
      - per_file_baseline
      - baseline_diff
    alternatives:
      - repo: rubik/radon
        package: radon
        license: MIT
        adoptable: true
        adoption_note: "MIT, already a declared runtime dependency"
        has:
          maintainability_index: "radon mi computes the maintainability index per module"
          halstead_metrics: "radon hal reports volume, difficulty and effort"
          cyclomatic_complexity: "radon cc ranks blocks A-F"
      - repo: jendrikseipp/vulture
        package: vulture
        license: MIT
        adoptable: true
        adoption_note: "MIT, already a declared runtime dependency"
        has:
          dead_code: "Reports unused code with a confidence percentage"
          per_file_baseline: "Whitelist files suppress known-live symbols"
      - repo: tonybaloney/wily
        package: wily
        license: Apache-2.0
        adoptable: true
        adoption_note: "Apache-2.0, tracks metrics across git history"
        has:
          trend_over_time: "wily build indexes metrics across git revisions; wily graph and wily diff report movement"
          maintainability_index: "Tracks radon maintainability index as an indexed metric"
          baseline_diff: "wily diff reports metric change against a revision"
      - repo: kucherenko/jscpd
        package: jscpd
        license: MIT
        adoptable: false
        adoption_note: "npm only; adopting it means a Node toolchain at gate time"
        has:
          clone_detection: "Token-based copy-paste detection with a --threshold failure gate"
          multi_language: "Documents over 150 formats"
          sarif_output: "Reporters include sarif"

  - key: documentation-integrity
    kind: quality
    title: Executable documentation quality and link integrity gate
    short: Docs validator
    path: tools/docs_validator.py
    paths:
      - tools/docs_validator.py
      - tools/doc_core.py
      - tools/doc_rules_mermaid.py
      - tools/doc_rules_structure.py
    ours:
      - link_checking
      - diagram_rendering
      - markdown_structure
      - secret_scanning
      - auto_fix
      - per_file_baseline
      - baseline_diff
    alternatives:
      - repo: DavidAnson/markdownlint
        has:
          markdown_structure: "Rule set MD001-MD059 covers heading, list and fence structure"
          auto_fix: "--fix applies safe rule fixes"
          config_presets: ".markdownlint.json enables or disables rules individually"
      - repo: lycheeverse/lychee
        has:
          link_checking: "Async link checker for markdown, HTML and text"
          multi_language: "Checks links in any text format, not one markup language"
      - repo: vale-cli/vale
        has:
          prose_style: "Applies configurable prose style guides such as Microsoft or Google"
          multi_language: "Supports markdown, reStructuredText, AsciiDoc and code comments"
          config_presets: "Styles are installable packages selected in .vale.ini"

  - key: prompt-adversarial-testing
    kind: quality
    title: Adversarial prompt mutation against agent instructions
    short: Prompt fuzzer
    path: examples/prompt-mutation-fuzzer/fuzzer.py
    ours:
      - adversarial_prompts
    alternatives:
      - repo: NVIDIA/garak
        has:
          adversarial_prompts: "Probe modules generate attack prompts against a target generator"
          attack_taxonomy: "Probes are organised against a published vulnerability taxonomy"
          model_providers: "Generators for OpenAI, Hugging Face, Replicate, local models and more"
      - repo: promptfoo/promptfoo
        has:
          adversarial_prompts: "Red-team plugins generate adversarial test cases"
          model_providers: "Declarative provider list covering many hosted and local models"
          baseline_diff: "Evaluations compare prompt or model variants side by side"

  # --- Application-shaped capabilities -------------------------------------------------
  #
  # Added because the survey's world was four analysis tools, so every gap it could emit
  # was a linter feature and twelve of sixteen sample applications were invisible to it.
  # An instrument that chooses the repository's work cannot see only the part of the
  # repository it was first pointed at.

  - key: go-concurrency-leak-detection
    kind: quality
    title: Go concurrency leak detection and runtime trace analysis
    short: Go leak sentinel
    path: examples/go-leak-sentinel/
    ours:
      - goroutine_leak_detection
    alternatives:
      - repo: uber-go/goleak
        has:
          goroutine_leak_detection: "VerifyNone and VerifyTestMain fail when goroutines outlive a test"
          test_harness_integration: "Drops into an existing go test run with no separate tooling"
      - repo: fortytw2/leaktest
        has:
          goroutine_leak_detection: "leaktest.Check compares goroutine snapshots taken around a test"
          test_harness_integration: "Called from inside a standard Go test function"

  - key: polyglot-structural-parsing
    kind: capability
    title: Multi-language structural parsing for code analysis
    short: CST parser
    path: examples/polyglot-cst-parser/
    ours:
      - multi_language
      - cyclomatic_complexity
    alternatives:
      - repo: tree-sitter/tree-sitter
        package: tree-sitter
        license: MIT
        adoptable: true
        adoption_note: "MIT, official Python bindings on PyPI"
        has:
          multi_language: "Separate grammars per language, from one parsing engine"
          incremental_parsing: "Reparses an edited buffer without reparsing the file"
          structural_query: "S-expression query language matches syntax nodes by pattern"
      - repo: ast-grep/ast-grep
        has:
          multi_language: "--lang selects among many supported languages"
          structural_query: "Patterns are written as code and matched structurally, not textually"

  - key: agent-web-acquisition
    kind: capability
    title: Adaptive web acquisition for agent context
    short: Web crawler
    path: examples/adaptive-web-crawler/
    ours:
      - javascript_rendering
      - politeness_controls
      - strategy_memory
      - llm_ready_output
    alternatives:
      - repo: unclecode/crawl4ai
        has:
          javascript_rendering: "Drives a headless browser so client-rendered pages resolve"
          llm_ready_output: "Emits Markdown shaped for model consumption"
      - repo: firecrawl/firecrawl
        has:
          javascript_rendering: "Renders pages before extraction"
          llm_ready_output: "Scrape and crawl endpoints return Markdown for LLMs"
      - repo: scrapy/scrapy
        has:
          politeness_controls: "DOWNLOAD_DELAY and AutoThrottle pace requests per domain"

  - key: untrusted-code-sandboxing
    kind: capability
    title: Ephemeral sandboxing of agent-generated code
    short: Sandbox
    path: examples/ephemeral-container-sandbox/
    ours:
      - resource_caps
      - egress_control
      - benchmark_audit
      - syscall_isolation
    alternatives:
      - repo: google/gvisor
        has:
          syscall_isolation: "Intercepts application system calls in a user-space kernel"
          resource_caps: "Runs under the container runtime's cgroup limits"
      - repo: firecracker-microvm/firecracker
        has:
          syscall_isolation: "Each workload runs in its own microVM with a minimal device model"
          resource_caps: "Per-microVM memory and vCPU sizing"
      - repo: e2b-dev/E2B
        has:
          syscall_isolation: "Runs AI-generated code in an isolated sandbox rather than the host"

  - key: repository-context-packing
    kind: capability
    title: Packing repository context into a model budget
    short: Context packer
    path: examples/binary-search-context-packer/
    ours:
      - token_budgeting
    alternatives:
      - repo: yamadashy/repomix
        has:
          repo_packing: "Packs an entire repository into a single model-ready file"
          token_budgeting: "Reports a token count per file and for the whole pack"
      - repo: Aider-AI/aider
        has:
          repo_packing: "Builds a repository map of definitions rather than whole files"
          token_budgeting: "Sizes the map to a configurable token budget"
          relevance_ranking: "Ranks the map with a graph algorithm over symbol references"

  - key: agent-trace-observability
    kind: capability
    title: Distributed tracing and cost attribution for agent runs
    short: Trace generator
    path: examples/agent-telemetry-trace-generator/
    paths:
      - examples/agent-telemetry-trace-generator/
      - tools/semconv_snapshot.py
    ours:
      - otel_export
      - cost_attribution
      - waterfall_rendering
      - semantic_conventions
    alternatives:
      - repo: traceloop/openllmetry
        has:
          otel_export: "Emits OpenTelemetry spans for model and vector-store calls"
          semantic_conventions: "Follows published conventions for GenAI span attributes"
      - repo: Arize-ai/openinference
        has:
          otel_export: "OpenTelemetry instrumentation for AI frameworks"
          semantic_conventions: "Publishes the semantic conventions it instruments against"

  - key: application-scaffolding
    kind: capability
    title: Contract-driven application scaffolding
    short: App factory
    path: tools/app_factory.py
    # Every file the capability is implemented in, so a capability that outgrows one module
    # is not handed back to the location fallback and counted as an instrument.
    paths:
      - tools/app_factory.py
      - tools/contract_variables.py
    ours:
      - contract_driven
      - gate_clean_output
      - regeneration_safe
      - interactive_prompts
    alternatives:
      - repo: cookiecutter/cookiecutter
        has:
          interactive_prompts: "Prompts for each variable declared in cookiecutter.json"
          template_ecosystem: "A large published index of community templates"
      - repo: copier-org/copier
        has:
          interactive_prompts: "Questions declared in copier.yml are asked at generation time"
          update_in_place: "copier update re-applies a newer template revision to an existing project"
      - repo: yeoman/generator
        has:
          interactive_prompts: "Generators prompt through an interactive dialogue"
          template_ecosystem: "A published registry of installable generators"
