name: Recursive Self-Hardening Feedback Loop

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit-hardening:
    name: Verify Instruction Hardening on Merged Defect
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Inspect PR Labels for Defect Classification
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const isDefect = labels.some(l => ['bug', 'defect', 'regression'].includes(l.toLowerCase()));
            console.log(`PR #${context.payload.pull_request.number} isDefect: ${isDefect}`);
            core.setOutput('is_defect', isDefect);

      - name: Audit Self-Hardening in Diff
        id: audit
        if: steps.classify.outputs.is_defect == 'true'
        env:
          # Never interpolated into the shell; see `pr-sentinel.yml` for the full reason.
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # Never a three-dot range against the base branch: once a pull request is merged
          # its commit is an ancestor of the base, so the merge base of
          # `origin/main...<merge sha>` is the merge sha itself and the diff is empty. This
          # workflow had never executed, and on its first run it reported "AGENTS.md was not
          # updated" for a pull request that had added a whole section to it.
          #
          # `MERGE_SHA^1` is only the pre-merge base tip for a *merge commit*. A squash
          # merge produces a single commit whose first parent is the base tip, so it works
          # there too -- but a rebase merge replays each commit onto the base and
          # `merge_commit_sha` is the *last* of them, so `^1` is the second-to-last commit
          # of the same pull request and the audit sees only its final commit. A three-commit
          # rebase whose guardrail landed in commit one was judged on commit three alone.
          # `allow_rebase_merge` is enabled on this repository, so that path is reachable.
          #
          # Walking back `commits` from the merge sha covers all three strategies: one for
          # squash and merge, N for rebase.
          git fetch --quiet --depth=$((COMMITS + 2)) origin "${MERGE_SHA}" 2>/dev/null || true
          if git merge-base --is-ancestor "${BASE_SHA}" "${MERGE_SHA}" 2>/dev/null; then
            RANGE_START="${BASE_SHA}"
          else
            RANGE_START="${MERGE_SHA}~${COMMITS}"
          fi
          git diff "${RANGE_START}" "${MERGE_SHA}" > /tmp/pr_diff.patch

          # An empty diff means the revision range is wrong, not that a merged pull
          # request changed nothing. Failing loudly here is what turns the next range
          # mistake into a red job instead of a false accusation in a new issue.
          if [ ! -s /tmp/pr_diff.patch ]; then
            echo "::error::Empty diff for ${MERGE_SHA}; the revision range is wrong."
            exit 1
          fi

          python tools/project_tooling.py verify-hardening \
            --diff-file /tmp/pr_diff.patch \
            --is-defect || echo "hardening_failed=true" >> "$GITHUB_ENV"

      - name: Open Self-Hardening Issue if Hardening Missing
        if: env.hardening_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const issueTitle = `[Self-Hardening]: Codify preventative guardrails in AGENTS.md for PR #${pr.number}`;
            const issueBody = `### 🔄 Positive Recursive Development: Missing AGENTS.md Hardening

            Pull request #${pr.number} resolved a defect (*"${pr.title}"*), but no preventative guardrails or rules were added to \`AGENTS.md\`.

            **Autonomous Rule Mandate**:
            > *Whenever an agent or workflow fixes a bug, it must harden \`AGENTS.md\` with defensive rules to prevent recurrence.*

            **Action Required**:
            - [ ] Review the root cause of PR #${pr.number}.
            - [ ] Propose an update to \`AGENTS.md\` with a defensive pre-flight check or invariant rule.
            - [ ] Open a PR linked to this issue.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['hardening', 'triage-needed']
            });
