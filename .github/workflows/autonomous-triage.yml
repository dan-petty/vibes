name: Autonomous Issue Triage & Project Grounding

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Taxonomize & Ground Issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run Autonomous Triage Tooling
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Written from the environment, never interpolated. Actions substitutes
          # workflow expressions before the shell parses anything, so an issue body
          # containing a heredoc terminator or command substitution would escape
          # into the runner. Reading it from env removes that path entirely.
          printf '%s' "${ISSUE_BODY}" > /tmp/issue_body.md

          python tools/project_tooling.py triage-issue \
            --number "${ISSUE_NUMBER}" \
            --title "${ISSUE_TITLE}" \
            --body-file /tmp/issue_body.md > /tmp/triage_plan.txt

          cat /tmp/triage_plan.txt

      - name: Apply Taxonomical Labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/triage_plan.txt', 'utf8');
            
            // Extract labels line: '   Labels: ['...', '...']'
            const match = plan.match(/Labels:\s*\[(.*?)\]/);
            if (match && match[1]) {
              const labels = match[1]
                .split(',')
                .map(s => s.replace(/['" ]/g, ''))
                .filter(Boolean);
              
              if (labels.length > 0) {
                console.log(`Applying labels: ${labels.join(', ')}`);
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labels,
                });
              }
            }

      - name: Post Autonomous Onboarding Comment
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/triage_plan.txt', 'utf8');

            // Slice from the header rather than splitting on it and re-joining. The old
            // form trimmed the remainder, which ate the space in `Grounding — Issue #5`
            // and rendered `Grounding— Issue #5`. The step had never run: it is gated on
            // `action == 'opened'`, and the workflow's first execution came from an edit.
            const marker = '### 🤖 Autonomous Project Grounding';
            const start = plan.indexOf(marker);
            if (start !== -1) {
              const commentBody = plan.slice(start).trim();
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
