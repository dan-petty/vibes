name: CI Quality Gate & Invariant Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-scanning:
    name: Publish Findings to Code Scanning
    runs-on: ubuntu-latest
    # A fork's pull request has no write token, so the upload would fail for a contributor
    # who did nothing wrong. Generation still runs everywhere; only publication is gated.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install Dependencies
        run: pip install --editable "."

      - name: Emit SARIF From Every Oracle
        # Deliberately not --fail-on-error: the gates in `certify` already decide whether
        # the build passes. This job exists to put findings in the diff, and a second
        # verdict on the same findings would only ever disagree with the first.
        run: python tools/sarif_report.py --out findings.sarif

      - name: Verify the Finding Baseline Is Not Stale
        # An accepted finding that no longer exists goes on suppressing that finding if it
        # is ever reintroduced, so the gate quietly stops covering code it used to cover.
        # This repository's baseline is empty and a unit test keeps it that way; the check
        # exists so the mechanism is exercised rather than merely shipped.
        run: |
          python tools/finding_baseline.py status \
            --source findings.sarif \
            --baseline artifacts/finding-baseline.json \
            --strict

      - name: Upload to Code Scanning
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: findings.sarif
          category: vibes-oracles

  certify:
    name: Verify Invariants & Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          # The manifest is the single source of the dependency list. Hardcoding it here
          # is how the pre-push hook came to be missing pyyaml and markdown-it-py.
          python -m pip install --upgrade pip
          pip install --editable ".[test,lint]"

      - name: Execute Full Test Suite (All Milestones)
        run: |
          pytest tests/ examples/ benchmarks/ -v --tb=short

      # The Go half of the leak sentinel exhibit. Go does not depend on the Python
      # version, so one leg runs it. The module has no dependencies and no go.sum,
      # so there is nothing to cache.
      - name: Set up Go
        if: matrix.python-version == '3.15'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: examples/go-leak-sentinel/go.mod
          cache: false

      - name: Vet the Go Leak Sentinel
        if: matrix.python-version == '3.15'
        working-directory: examples/go-leak-sentinel
        run: go vet ./...

      - name: Test the Go Leak Sentinel
        if: matrix.python-version == '3.15'
        working-directory: examples/go-leak-sentinel
        run: go test ./...

      - name: Enforce Test Coverage Floor
        run: |
          # addopts is overridden because pytest.ini disables the coverage plugin to keep
          # the inner development loop fast; coverage is a release gate, not a loop cost.
          python -m pytest tests examples benchmarks -q -o addopts= -p no:cacheprovider \
            --cov=tools --cov=examples --cov=benchmarks \
            --cov-report=term-missing:skip-covered --cov-fail-under=90

      - name: Lint (correctness, modernization, import order)
        run: |
          ruff check tools tests examples benchmarks

      - name: Type Check tools/
        # `tools/` is the source root: its scripts import each other by bare module name.
        working-directory: tools
        run: |
          mypy .

      - name: Run AST Invariant Sentinel (All Python Sources)
        run: |
          python examples/ast-invariant-sentinel/sentinel.py tools examples tests benchmarks

      - name: Verify the Semantic Convention Snapshot
        run: |
          # Offline by design. Refreshing needs upstream and a gate must not, so this
          # checks the committed snapshot's internal agreement instead: every attribute a
          # span requires is one the registry defines or one declared external.
          python tools/semconv_snapshot.py verify

      - name: Replay the Fuzzing Regression Corpus
        run: |
          # Every input here once broke an instrument. Replay is deterministic and only
          # grows; exploration runs on a schedule in fuzz.yml, where a run that finds
          # something is a finding rather than a red build on an unrelated commit.
          python tools/fuzz_harness.py replay

      - name: Validate Documentation Quality & Link Integrity
        run: |
          python tools/docs_validator.py --strict

      - name: Lint GitHub Actions Workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

      - name: Verify Every Mermaid Diagram Renders
        run: |
          npm install --no-save mermaid@11 jsdom@30
          node tools/verify_mermaid.mjs .

      # Deliberately after the npm install above. Every earlier gate runs against a
      # clean checkout, so none of them can see an instrument that mistakes a vendored
      # dependency for repository source; that defect only exists once one is on disk.
      - name: Verify Instruments Agree On the Corpus (Dependencies Installed)
        run: |
          python -m pytest tests/test_source_tree_policy.py -q -o addopts= -p no:cacheprovider

      - name: Validate FastMCP JSON Schema Manifests
        run: |
          python -m json.tool artifacts/schemas/fastmcp-agent-tool-manifest-spec.json > /dev/null

      - name: Enforce Reliability Objectives & Error Budgets
        run: |
          python tools/reliability_slo.py status --history docs/reliability/iterations

