name: CI Quality Gate & Invariant Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    name: Verify Invariants & Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio markdown-it-py pyyaml

      - name: Execute Full Test Suite (All Milestones)
        run: |
          pytest tests/ examples/ benchmarks/ -v --tb=short

      - name: Run AST Invariant Sentinel (All Python Sources)
        run: |
          python examples/ast-invariant-sentinel/sentinel.py examples
          python examples/ast-invariant-sentinel/sentinel.py tools
          python examples/ast-invariant-sentinel/sentinel.py benchmarks/benchmark_runner.py

      - name: Validate Documentation Quality & Link Integrity
        run: |
          python tools/docs_validator.py --strict

      - name: Validate FastMCP JSON Schema Manifests
        run: |
          python -m json.tool artifacts/schemas/fastmcp-agent-tool-manifest-spec.json > /dev/null

      - name: Verify Observation Structure Compliance
        run: |
          python tools/docs_validator.py observations/ --rule observation_structure
