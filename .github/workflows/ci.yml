name: CI Quality Gate & Invariant Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    name: Verify Invariants & Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          # The manifest is the single source of the dependency list. Hardcoding it here
          # is how the pre-push hook came to be missing pyyaml and markdown-it-py.
          python -m pip install --upgrade pip
          pip install --editable ".[test,lint]"

      - name: Execute Full Test Suite (All Milestones)
        run: |
          pytest tests/ examples/ benchmarks/ -v --tb=short

      - name: Enforce Test Coverage Floor
        run: |
          # addopts is overridden because pytest.ini disables the coverage plugin to keep
          # the inner development loop fast; coverage is a release gate, not a loop cost.
          python -m pytest tests examples benchmarks -q -o addopts= -p no:cacheprovider \
            --cov=tools --cov=examples --cov=benchmarks \
            --cov-report=term-missing:skip-covered --cov-fail-under=90

      - name: Lint (correctness, modernization, import order)
        run: |
          ruff check tools tests examples benchmarks

      - name: Type Check tools/
        # `tools/` is the source root: its scripts import each other by bare module name.
        working-directory: tools
        run: |
          mypy .

      - name: Run AST Invariant Sentinel (All Python Sources)
        run: |
          python examples/ast-invariant-sentinel/sentinel.py tools examples tests benchmarks

      - name: Validate Documentation Quality & Link Integrity
        run: |
          python tools/docs_validator.py --strict

      - name: Lint GitHub Actions Workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

      - name: Verify Every Mermaid Diagram Renders
        run: |
          npm install --no-save mermaid@11 jsdom
          node tools/verify_mermaid.mjs .

      # Deliberately after the npm install above. Every earlier gate runs against a
      # clean checkout, so none of them can see an instrument that mistakes a vendored
      # dependency for repository source; that defect only exists once one is on disk.
      - name: Verify Instruments Agree On the Corpus (Dependencies Installed)
        run: |
          python -m pytest tests/test_source_tree_policy.py -q -o addopts= -p no:cacheprovider

      - name: Validate FastMCP JSON Schema Manifests
        run: |
          python -m json.tool artifacts/schemas/fastmcp-agent-tool-manifest-spec.json > /dev/null

      - name: Enforce Reliability Objectives & Error Budgets
        run: |
          python tools/reliability_slo.py status --history docs/reliability/iterations

