name: PR Title

# release-please reads the title of each squash commit on main as a Conventional Commit, so the
# reusable workflow pr-title.yml of dan-petty/github-workflows checks the title of each pull request
# into main. A scope is one of the scope/* labels of .github/labels.yml, or main, the scope of the
# release pull request.
# The caller pins the commit of the release tag of dan-petty/github-workflows that rendered this
# file, with the tag in a comment: the form of a digest pin of the github-actions manager of
# Renovate. Only `copier update` changes both: Renovate leaves this pin to the template.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions: {}

jobs:
  pr-title:
    name: PR title
    uses: dan-petty/github-workflows/.github/workflows/pr-title.yml@7b87b8c4e7a638fa1f3cd69903e720fdd487728a # v0.2.0
    permissions:
      contents: read # Read .github/labels.yml.
      pull-requests: read # Read the title and the commits of the pull request.
