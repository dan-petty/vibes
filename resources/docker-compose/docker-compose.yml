services:
  # Distributed Tracing UI & OTLP Ingest
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: vibes-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Web UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - agent-mesh
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:16686/ | grep -q 'Jaeger UI' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  # OpenTelemetry Collector Contrib
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: vibes-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"   # Prometheus metrics exporter
      - "127.0.0.1:13133:13133" # Health check
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - agent-mesh

  # Prometheus Metric Store & Alerts
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: vibes-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus-agent-alerts.yaml:/etc/prometheus/alerts.yaml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - agent-mesh

  # Valkey L2 AST & Tool Caching
  valkey:
    image: valkey/valkey:8.0.1
    container_name: vibes-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - agent-mesh
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Grafana Dashboard & Visualizations
  grafana:
    image: grafana/grafana:11.3.0
    container_name: vibes-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      # Required, with no default: an unset password fails the stack at startup rather
      # than silently standing up a known-credential dashboard.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/agent-telemetry-dashboard.json:/var/lib/grafana/dashboards/agent-telemetry-dashboard.json:ro
    networks:
      - agent-mesh
    depends_on:
      - prometheus

  # Hardened Local Agent Execution Sandbox
  agent-sandbox:
    image: python:3.14-slim
    container_name: vibes-agent-sandbox
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /workspace:size=256M,mode=0755
    working_dir: /workspace
    command: ["sleep", "infinity"]
    networks:
      - agent-mesh
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  agent-mesh:
    driver: bridge
