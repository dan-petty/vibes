apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-workloads-quota
  namespace: agent-workloads
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/part-of: vibes-mesh
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "10"
    count/persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-workloads-limits
  namespace: agent-workloads
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      max:
        cpu: "2000m"
        memory: "2Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
