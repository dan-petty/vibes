# The settings baseline of this repository on GitHub. `devops repos onboard` applies it, and
# `devops repos onboard --all --plan` shows each difference. Each key is the request body of one
# endpoint of the GitHub REST API, with the field names of that body. The schema of the file is
# templates/github-repository.schema.json of dan-petty/github-workflows at the tag v0.2.0.
# The template writes this file from the answers of .copier-answers.yml: change an answer with
# `copier update --data <question>=<answer>`, not this file.

# PATCH /repos/{owner}/{repo}. Squash is the only merge method. The squash commit gets the title and
# the body of the pull request, so the pull request title is the Conventional Commit that
# release-please reads. Auto-merge merges a pull request when its required checks pass.
repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  allow_auto_merge: true
  allow_update_branch: true
  delete_branch_on_merge: true
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled

# PUT /repos/{owner}/{repo}/vulnerability-alerts: the alerts of a vulnerable dependency. Renovate
# opens the security update pull requests, so the Dependabot security updates stay off.
vulnerability_alerts: true

# PUT /repos/{owner}/{repo}/private-vulnerability-reporting: a reporter can send a private report.
private_vulnerability_reporting: true

# PUT /repos/{owner}/{repo}/immutable-releases: nobody can move or delete the tag of a published
# release, so a pin of a tag always gets the same content.
immutable_releases: true

# PATCH /repos/{owner}/{repo}/code-scanning/default-setup: CodeQL scans each language that GitHub
# finds in the repository.
code_scanning_default_setup:
  state: configured
  query_suite: default

# PUT /repos/{owner}/{repo}/actions/permissions/workflow: the job token can only read, unless a job
# asks for more, and no workflow approves a pull request.
actions_workflow_permissions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

# POST /repos/{owner}/{repo}/rulesets, or PUT /repos/{owner}/{repo}/rulesets/{ruleset_id} for a
# ruleset of the same name. A private repository on the GitHub Free plan has no rulesets.
rulesets:
  - name: main
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - squash
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
      # Each check of the answer required_checks, and the title check of
      # .github/workflows/pr-title.yml, which reports on each pull request into main. Integration
      # 15368 is GitHub Actions: only a job of a workflow can report the check. The command also
      # adds each check that reported on the template pull request (devops-cli#6773, decision D3).
      - type: required_status_checks
        parameters:
          do_not_enforce_on_create: true
          required_status_checks:
            - context: PR title / Semantic PR title
              integration_id: 15368
          strict_required_status_checks_policy: false
      - type: code_scanning
        parameters:
          code_scanning_tools:
            - tool: CodeQL
              alerts_threshold: errors
              security_alerts_threshold: high_or_higher
      - type: code_quality
        parameters:
          severity: errors
