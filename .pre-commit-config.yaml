# Resolve whatever modern interpreter the contributor has; pinning an exact minor
# version makes every hook unrunnable for anyone who does not happen to have it.
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: ast-invariant-sentinel
        name: AST Invariant Sentinel (M≤10, depth≤5, zero RFC 1918 IPs)
        language: python
        entry: python examples/ast-invariant-sentinel/sentinel.py
        files: \.py$
        # N staged filenames per invocation; sentinel.py audits every one (argparse nargs="*").
        pass_filenames: true
        additional_dependencies: []

      - id: ruff
        name: Ruff (correctness, modernization, import order)
        language: python
        entry: ruff check --force-exclude
        files: \.py$
        # N staged filenames per invocation. Configuration lives in pyproject.toml so the
        # hook, CI and a developer's own `ruff check` cannot disagree about the rule set.
        pass_filenames: true
        additional_dependencies: [ruff>=0.6]

      - id: docs-validator
        name: Docs Validator (fences, Mermaid, tables, links)
        language: python
        entry: python tools/docs_validator.py
        files: \.(md|markdown)$
        # Deliberately whole-repository: cross-document link integrity cannot be judged
        # from the changed files alone (a rename breaks inbound links in untouched docs).
        pass_filenames: false
        # Mirrors the runtime dependencies declared in pyproject.toml.
        additional_dependencies: [jsonschema, markdown-it-py, networkx, pyyaml, radon, vulture]

      - id: pytest-collection-check
        name: Pytest Collection Sanity Check
        language: python
        entry: pytest --collect-only -q
        pass_filenames: false
        stages: [pre-push]
        # Collection imports every test module, so this env needs the same runtime
        # dependencies as ci.yml: pyyaml and markdown-it-py, not just the runner.
        additional_dependencies: [pytest, pytest-asyncio, jsonschema, markdown-it-py, networkx, pyyaml, radon, vulture]

      - id: mypy
        name: mypy (tools/)
        language: python
        # `tools/` is the source root: its scripts import each other by bare module name,
        # so mypy runs from inside it. Pointing it at `tools/` from the repository root
        # resolves every file twice and aborts before checking anything.
        entry: bash -c 'cd tools && python -m mypy .'
        files: ^tools/.*\.py$
        pass_filenames: false
        stages: [pre-push]
        additional_dependencies: [mypy>=2.0, types-PyYAML, types-jsonschema, jsonschema, markdown-it-py, networkx, pyyaml, radon, vulture]

      - id: json-schema-lint
        name: JSON Schema Lint (FastMCP Manifests)
        language: python
        entry: python -m json.tool
        files: artifacts/schemas/.*\.json$
        pass_filenames: true
        args: ["--no-ensure-ascii"]
